version: '3.8'

services:
  postgres-auth:
    image: postgres:15-alpine
    container_name: rooms-postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rooms_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    restart: unless-stopped

  redis-gateway:
    image: redis:7-alpine
    container_name: rooms-redis-gateway
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata_auth:
