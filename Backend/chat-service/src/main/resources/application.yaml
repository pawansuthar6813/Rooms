spring:
  application:
    name: chat-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/rooms_chat}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8084}

eureka:
  instance:
    preferIpAddress: true
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

grpc:
  client:
    room-service:
      address: static://${ROOM_SERVICE_GRPC_HOST:localhost}:${ROOM_SERVICE_GRPC_PORT:9082}
      negotiation-type: plaintext

logging:
  level:
    com.rooms.chat_service: DEBUG
