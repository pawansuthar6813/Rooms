syntax = "proto3";

package com.rooms.grpc.auth;
option java_multiple_files = true;
option java_package = "com.rooms.grpc.auth";
option java_outer_classname = "AuthProto";

service AuthService {
  rpc GetUserById(UserIdRequest) returns (UserInfo);
}

message UserIdRequest {
  string user_id = 1;
}

message UserInfo {
  string user_id = 1;
  string username = 2;
  string email = 3;
}
