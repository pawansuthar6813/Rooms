syntax = "proto3";

package com.rooms.grpc.room;
option java_multiple_files = true;
option java_package = "com.rooms.grpc.room";
option java_outer_classname = "RoomProto";

service RoomService {
  rpc GetRoomMembers(RoomIdRequest) returns (MemberList);
}

message RoomIdRequest {
  string room_id = 1;
}

message MemberList {
  repeated MemberInfo members = 1;
}

message MemberInfo {
  string user_id = 1;
  string role = 2;
}
