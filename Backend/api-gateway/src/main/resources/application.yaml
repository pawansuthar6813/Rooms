spring:
  application:
    name: api-gateway
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${ENVIRONMENT:dev}
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: room-service
          uri: lb://room-service
          predicates:
            - Path=/rooms/**
        - id: board-service
          uri: lb://board-service
          predicates:
            - Path=/rooms/{roomId}/topics/**
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/chat/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/files/**
        - id: websocket
          uri: lb://board-service
          predicates:
            - Path=/ws/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}
