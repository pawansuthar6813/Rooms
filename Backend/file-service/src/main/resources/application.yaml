spring:
  application:
    name: file-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/rooms_file}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:25}MB
      max-request-size: ${MAX_FILE_SIZE_MB:25}MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8085}

eureka:
  instance:
    preferIpAddress: true
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

grpc:
  client:
    room-service:
      address: static://${ROOM_SERVICE_GRPC_HOST:localhost}:${ROOM_SERVICE_GRPC_PORT:9082}
      negotiation-type: plaintext

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:demo}
  api_key: ${CLOUDINARY_API_KEY:key}
  api_secret: ${CLOUDINARY_API_SECRET:secret}

logging:
  level:
    com.rooms.file_service: DEBUG
