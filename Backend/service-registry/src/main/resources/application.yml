spring:
  application:
    name: service-registry
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${ENVIRONMENT:dev}

server:
  port: ${SERVER_PORT:8761}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    waitTimeInMsWhenSyncEmpty: 0
